---
# .github/workflows/ci.yml — intégration continue du dépôt.
#
# Obligatoire depuis la décision 50 : aucun push sur master dont la CI est
# rouge. Trois travaux indépendants, en parallèle, chacun sous sa propre borne
# de temps.
#
# Le travail « bash » ne réinvente rien : il appelle le même point d'entrée que
# sur le poste de travail, tests/env/run-in-container.sh, qui construit une
# Debian 12 jetable et y exécute tests/run.sh. La CI valide donc exactement ce
# qu'un humain valide à la main.
#
# Trois niveaux de tests sur cinq seulement, et c'est délibéré :
#
#   environment  exige le profil « systemd », dont le conteneur démarre sur
#                /sbin/init avec --privileged — non garanti sur un runner
#                GitHub. Il reste validé sur le poste de travail (registre A153).
#   acceptance   valide les critères d'UNE tâche, pas l'état du dépôt : ses
#                fichiers vont et viennent avec les tâches. Il se lance à la
#                clôture d'une tâche, pas à chaque push.
#
# Molecule éprouve le rôle securite_base depuis TASK-081, dans deux conteneurs
# systemd privilégiés — Debian 12 et Ubuntu 24.04. Le runner GitHub étant une
# machine virtuelle, ces conteneurs devraient y démarrer ; c'est le premier run
# de ce travail qui le dira, et non ce commentaire.
#
# L'outillage Ansible suit le même chemin depuis TASK-085 : un conteneur
# jetable, tests/env/Dockerfile.ansible, que la CI lance par le même point
# d'entrée que le poste de travail. Le runner ne porte plus aucun outil
# installé par pipx — c'est le conteneur qui reçoit le socket Docker du runner
# et crée les instances Molecule avec ce démon.
#
# Les versions d'ansible, d'ansible-lint, de yamllint et de Molecule sont
# épinglées dans ce Dockerfile : sans cela, une publication amont pourrait
# faire rougir la CI sans qu'une ligne du dépôt change. Elles suivent celles du
# poste de contrôle (Ansible/README.md).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-lint-unit:
    name: Bash — lint et unit en conteneur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Analyse statique et tests unitaires, conteneur Debian jetable
        run: bash tests/env/run-in-container.sh -- bash tests/run.sh lint unit

  bash-integration:
    name: Bash — integration en conteneur
    runs-on: ubuntu-latest
    # Le niveau « integration » exécute réellement les scripts, installe des
    # paquets et rejoue chaque cas deux fois pour l'idempotence : il a demandé
    # une douzaine de minutes sur le poste de travail. Il tourne donc à part,
    # en parallèle du reste, avec une borne plus large.
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Exécuter les scripts dans un conteneur Debian jetable
        run: bash tests/env/run-in-container.sh -- bash tests/run.sh integration

  # Un seul travail, une seule commande : c'est celle que Ansible/README.md
  # donne au poste de travail. yamllint, ansible-lint, les collections du
  # scénario puis molecule test s'enchaînent dans tests/env/valider-ansible.sh,
  # exécuté dans le conteneur — la CI ne valide donc rien que l'humain ne
  # valide à la main, et rien n'est installé sur le runner.
  ansible:
    name: Ansible — yamllint, ansible-lint et Molecule sur securite_base
    runs-on: ubuntu-latest
    # Deux instances systemd construites puis éprouvées l'une après l'autre,
    # chacune installant ufw et fail2ban par apt : le double du travail du
    # scénario le plus long des tests Bash.
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Le conteneur reçoit le socket Docker du runner : Molecule pilote ce
      # démon-là, il n'en lance pas un second. C'est le même montage que sur le
      # poste de travail, où le socket est celui de Docker Desktop.
      - name: Outillage Ansible en conteneur jetable
        run: bash tests/env/run-in-container.sh --profil ansible -- tests/env/valider-ansible.sh
