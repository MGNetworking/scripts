---
# .github/workflows/ci.yml — intégration continue du dépôt.
#
# Obligatoire depuis la décision 50 : aucun push sur master dont la CI est
# rouge. Deux travaux indépendants, en parallèle, sous la barre des 15 minutes.
#
# Le travail « bash » ne réinvente rien : il appelle le même point d'entrée que
# sur le poste de travail, tests/env/run-in-container.sh, qui construit une
# Debian 12 jetable et y exécute tests/run.sh. La CI valide donc exactement ce
# qu'un humain valide à la main.
#
# Trois niveaux de tests sur cinq seulement, et c'est délibéré :
#
#   environment  exige le profil « systemd », dont le conteneur démarre sur
#                /sbin/init avec --privileged — non garanti sur un runner
#                GitHub. Il reste validé sur le poste de travail (registre A153).
#   acceptance   valide les critères d'UNE tâche, pas l'état du dépôt : ses
#                fichiers vont et viennent avec les tâches. Il se lance à la
#                clôture d'une tâche, pas à chaque push.
#
# Molecule éprouve le rôle securite_base depuis TASK-081, dans deux conteneurs
# systemd privilégiés — Debian 12 et Ubuntu 24.04. Le runner GitHub étant une
# machine virtuelle, ces conteneurs devraient y démarrer ; c'est le premier run
# de ce travail qui le dira, et non ce commentaire.
#
# Les versions d'ansible-lint et de yamllint sont épinglées : sans cela, une
# publication amont pourrait faire rougir la CI sans qu'une ligne du dépôt
# change. Elles suivent celles du poste de contrôle (Ansible/README.md).

name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  bash-lint-unit:
    name: Bash — lint et unit en conteneur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Analyse statique et tests unitaires, conteneur Debian jetable
        run: bash tests/env/run-in-container.sh -- bash tests/run.sh lint unit

  bash-integration:
    name: Bash — integration en conteneur
    runs-on: ubuntu-latest
    # Le niveau « integration » exécute réellement les scripts, installe des
    # paquets et rejoue chaque cas deux fois pour l'idempotence : il a demandé
    # une douzaine de minutes sur le poste de travail. Il tourne donc à part,
    # en parallèle du reste, avec une borne plus large.
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Exécuter les scripts dans un conteneur Debian jetable
        run: bash tests/env/run-in-container.sh -- bash tests/run.sh integration

  ansible:
    name: Ansible — yamllint et ansible-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer l'outillage par pipx
        run: |
          pipx install ansible-lint==26.8.0
          pipx install yamllint==1.38.0

      - name: Contrôler le style YAML de tout le dépôt
        run: yamllint .

      # ANSIBLE_ROLES_PATH est indispensable : les rôles ne sont pas à la
      # racine du dépôt mais sous Ansible/, et ansible.cfg, qui porte
      # roles_path, n'est lu que depuis Ansible/. Sans cette variable,
      # ansible-lint ne trouve pas securite_base et rend « syntax-check ».
      - name: Contrôler les rôles et playbooks
        run: ANSIBLE_ROLES_PATH="$PWD/Ansible/roles" ansible-lint Ansible/

  ansible-molecule:
    name: Ansible — Molecule sur Debian 12 et Ubuntu 24.04
    runs-on: ubuntu-latest
    # Deux instances systemd construites puis éprouvées l'une après l'autre,
    # chacune installant ufw et fail2ban par apt : le double du travail du
    # scénario le plus long des tests Bash.
    timeout-minutes: 30
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # Deux environnements, comme sur le poste de contrôle, et la bibliothèque
      # docker dans les deux : Molecule pilote le démon depuis le sien, mais
      # les modules docker, eux, s'exécutent avec le python d'ansible.
      - name: Installer l'outillage par pipx
        run: |
          pipx install --include-deps ansible==14.4.0
          pipx inject ansible docker==7.2.0
          pipx install molecule==26.8.0
          pipx inject molecule 'molecule-plugins[docker]==26.7.15' docker==7.2.0

      # Molecule vit dans son propre environnement, qui ne porte
      # qu'ansible-core : sans cette installation, ni son pilote Docker ni le
      # module ufw du rôle ne lui sont visibles. Le chemin est celui que
      # Molecule consulte en premier.
      - name: Installer les collections du rôle
        run: |
          ansible-galaxy collection install --force \
            -r Ansible/roles/securite_base/molecule/default/collections.yml \
            -p "$HOME/.ansible/collections"

      # Le scénario construit ses images avec « pull: false » : les bases
      # doivent donc être déjà présentes. C'est ce qui évite au pilote de
      # s'adresser au registre à chaque construction.
      - name: Tirer les images de base
        run: |
          docker pull debian:12
          docker pull ubuntu:24.04

      - name: Éprouver le rôle securite_base en conteneurs systemd
        working-directory: Ansible/roles/securite_base
        run: molecule test
