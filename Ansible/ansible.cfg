# Ansible/ansible.cfg — configuration du poste de contrôle.
#
# Lue uniquement quand une commande ansible est lancée DEPUIS ce dossier :
# Ansible ignore un ansible.cfg situé ailleurs que dans le répertoire courant
# (ou désigné par ANSIBLE_CONFIG). Toutes les commandes du README partent donc
# de Ansible/.
#
# Rien ici ne touche une machine : ce fichier ne fait que fixer des chemins et
# des valeurs par défaut du poste de contrôle.

[defaults]
# Inventaire réel, jamais versionné (voir .gitignore) : chacun le crée depuis
# inventory.example.yml.
inventory = inventory.yml
roles_path = roles

# Empêche Ansible de deviner un interpréteur Python et d'en avertir à chaque
# tâche : « auto_silent » prend le même choix que « auto », sans le message.
interpreter_python = auto_silent

# Les serveurs sont peu nombreux : cinq connexions simultanées suffisent.
forks = 5

# Ne jamais accepter une clé d'hôte inconnue en silence : une empreinte
# inattendue doit arrêter l'exécution, pas être enregistrée d'office.
host_key_checking = True

[ssh_connection]
# Une seule connexion SSH par hôte, réutilisée pour toutes les tâches.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
