---
# Ce que le rôle suppose déjà fait, et qu'il ne fait pas lui-même : un compte
# d'administration joignable par clé, et sshd démarré.

- name: Préparer l'instance comme un serveur fraîchement livré
  hosts: all
  become: true
  gather_facts: true

  vars:
    compte: exploitant

  tasks:
    - name: Créer le compte d'administration, membre de sudo
      ansible.builtin.user:
        name: "{{ compte }}"
        groups: sudo
        append: true
        shell: /bin/bash
        create_home: true

    - name: Créer le répertoire .ssh du compte
      ansible.builtin.file:
        path: "/home/{{ compte }}/.ssh"
        state: directory
        owner: "{{ compte }}"
        group: "{{ compte }}"
        mode: "0700"

    # La paire est engendrée dans l'instance, qui sera détruite : aucune clé
    # n'entre dans le dépôt, et la publique est une vraie clé, pas une chaîne
    # qui y ressemble.
    - name: Engendrer une paire de clés dans l'instance
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -N '' -C molecule -f /home/{{ compte }}/.ssh/id_ed25519
        creates: "/home/{{ compte }}/.ssh/id_ed25519"

    - name: Autoriser cette clé pour le compte
      ansible.builtin.copy:
        src: "/home/{{ compte }}/.ssh/id_ed25519.pub"
        dest: "/home/{{ compte }}/.ssh/authorized_keys"
        remote_src: true
        owner: "{{ compte }}"
        group: "{{ compte }}"
        mode: "0600"

    # sshd n'est pas démarré ici à dessein : chaque distribution doit rester
    # dans l'état où elle livre le paquet — « ssh.service » sur Debian 12,
    # « ssh.socket » sur Ubuntu 24.04. Le forcer masquerait le second cas, où
    # un rechargement échouerait.
    #
    # Reste à donner à sshd son répertoire de séparation de privilèges, sans
    # lequel « sshd -t » refuse de lire quoi que ce soit : « Missing privilege
    # separation directory: /run/sshd ». Sur un serveur, ce répertoire existe
    # dès que sshd a tourné une fois — et il a forcément tourné, puisque c'est
    # par lui qu'Ansible entre. Dans une instance où personne ne s'est jamais
    # connecté, il faut le créer. Constaté sur Ubuntu 24.04, dont la socket
    # n'avait encore lancé aucun démon.
    - name: Donner à sshd le répertoire que son service crée au démarrage
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Sur un serveur Debian, rsyslog tient /var/log/auth.log et la prison sshd
    # l'y lit. L'image de base n'a ni rsyslog ni ce fichier, et fail2ban
    # refuserait de démarrer : « Have not found any log file for sshd jail ».
    # Ubuntu 24.04 n'est pas concerné, sa prison lit le journal systemd.
    - name: Donner à fail2ban le journal d'authentification que Debian tient
      ansible.builtin.file:
        path: /var/log/auth.log
        state: touch
        owner: root
        group: adm
        mode: "0640"
      when: ansible_facts['distribution'] == 'Debian'
